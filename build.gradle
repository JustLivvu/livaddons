plugins {
    id 'fabric-loom' version '1.17.17'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
    flatDir {
        dirs 'libs'
    }
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
}

loom {
    customMinecraftManifest.set(
        "https://piston-meta.mojang.com/v1/packages/a5ba42111e0de7712d677c458bd0dbfc9f36482e/26.1.2.json"
    )
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings group: 'net.livaddons', name: 'dummy-mappings', version: '1.0'
    
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.155.2+26.1.2"
    
    modImplementation "net.fabricmc.fabric-api:fabric-command-api-v2:3.0.5+e2bdee784c"
    implementation "net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
